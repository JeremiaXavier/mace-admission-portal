version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mace_admission_app
    restart: always
    ports:
      - "80:80"
    environment:
      # These are read by entrypoint.sh to wait for MySQL before booting
      DB_HOST: db
      DB_USER: mace_user
      DB_PASS: mace_password
      DB_NAME: mace_admission
    volumes:
      # Mount the .env file so CodeIgniter picks up all config at runtime
      - ./env.production:/var/www/html/.env:ro
      # Persist the writable directory (uploads, session, cache, settings.json)
      - app_writable:/var/www/html/writable
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mace_admission_db
    restart: always
    environment:
      MYSQL_DATABASE: mace_admission
      MYSQL_USER: mace_user
      MYSQL_PASSWORD: mace_password
      MYSQL_ROOT_PASSWORD: strong_root_password
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mace_admission_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: strong_root_password
    depends_on:
      - db

volumes:
  db_data:
  app_writable:
